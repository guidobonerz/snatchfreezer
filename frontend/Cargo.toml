[package]
name = "snatchfreezer"
version = "2.0.0"
edition = "2021"
description = "Frontend of the Snatchfreezer high speed photography controller"

[dependencies]
drazui = { git = "https://github.com/guidobonerz/drazui" }
minifb = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
opt-level = 3
lto = "thin"
